name: CI Pipeline — Build & Typecheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Backend API
        run: npm run lint --workspace=@repo/api

      - name: Build Admin CRM Frontend
        run: npm run build --workspace=@repo/admin

      - name: Build Public Web Frontend
        run: npm run build --workspace=@repo/web
