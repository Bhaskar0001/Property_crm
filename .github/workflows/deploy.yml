name: CI/CD Pipeline — Build & Deploy to Hostinger VPS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Backend API
        run: npm run lint --workspace=@repo/api

      - name: Build Admin CRM Frontend
        run: npm run build --workspace=@repo/admin

      - name: Build Public Web Frontend
        run: npm run build --workspace=@repo/web

  deploy:
    name: Deploy to Hostinger VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Trigger remote deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            bash /var/www/realestate/scripts/deploy-vps.sh
